name: Validation PR source checks
on:
  push:
    branches: [feat/validation-batch-excel]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r web/backend/requirements.txt
      - run: python -m compileall -q web/backend/app
      - name: Synthetic template and job API contracts
        env:
          PYTHONPATH: web/backend
        run: |
          python - <<'PY'
          import io
          import time
          from zipfile import ZipFile
          from xlsxwriter import Workbook
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from app.validation_excel import parse_excel, export_excel
          from app.validation_batches import router, ValidationBatchService
          b=io.BytesIO()
          w=Workbook(b,{"in_memory":True})
          s=w.add_worksheet("Sheet1")
          s.write_row(0,0,["问题","预期答案"])
          s.write_row(1,0,["测试问题","仅用于输入模板原样保留"])
          w.close()
          rows=parse_excel(b.getvalue())
          assert len(rows)==1 and rows[0]["question"]=="测试问题"
          payload=export_excel(rows)
          with ZipFile(io.BytesIO(payload)) as package:
              assert "xl/workbook.xml" in package.namelist()
              strings=package.read("xl/sharedStrings.xml").decode("utf-8")
              assert all(k in strings for k in ("问题","预期答案","智能体实际回复","耗时(秒)","状态"))
          app=FastAPI()
          app.state.validation_batches=ValidationBatchService()
          app.state.ready=True
          app.include_router(router)
          @app.post("/api/runs")
          async def fake_run():
              return {"answer":"模拟回答","status":"completed","error":None}
          with TestClient(app) as client:
              response=client.post("/api/validation-batches/preview",
                                   files={"file":("sample.xlsx",b.getvalue())})
              assert response.status_code==200,response.text
              upload_id=response.json()["upload_id"]
              started=client.post(f"/api/validation-batches/{upload_id}/start")
              assert started.status_code==200,started.text
              job_id=started.json()["job_id"]
              for _ in range(40):
                  state=client.get(f"/api/validation-batches/jobs/{job_id}").json()
                  if state["state"]=="finished": break
                  time.sleep(0.1)
              assert state["state"]=="finished",state
              result=client.get(f"/api/validation-batches/jobs/{job_id}/export")
              assert result.status_code==200
              with ZipFile(io.BytesIO(result.content)) as package:
                  assert "模拟回答" in package.read("xl/sharedStrings.xml").decode("utf-8")
          PY
